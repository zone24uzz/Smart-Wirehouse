services:
  - type: web
    name: smart-warehouse-control-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: swc-database
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/db.json
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
